name: 全品类资讯飞书推送

on:
  schedule:
    # 完美对应北京时间（CST）早上的 06:05 一直运行到晚上的 22:05。深夜 23:05 到凌晨 05:05 之间彻底静默！
    - cron: '5 22-23,0-14 * * *'  
  workflow_dispatch:      # 支持手动点击运行

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 核心权限：允许自动更新并将 record.json 存回你的仓库
    steps:
      # 升级至官方支持 Node.js 24 的最新组件
      - uses: actions/checkout@v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装运行依赖
        run: |
          pip install requests feedparser

      - name: 执行全网资讯监控
        env:
          # 核心省心配置：强制 Python 实时刷新日志，打破缓存黑箱，100% 吐出每一个网站的巡逻签到
          PYTHONUNBUFFERED: 1
        run: python monitor.py

      - name: 自动保存运行状态到仓库
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add record.json || true
          git commit -m "自动更新运行状态 [skip ci]" || true
          git push || true
