Name: 全品类资讯飞书推送

on:
  schedule:
    - cron: '5 * * * *'  # 核心修改：错峰整点5分钟，每1小时雷打不动自动触发一次
  workflow_dispatch:      # 支持手动点击运行

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 核心权限：允许自动更新并将 record.json 存回你的仓库
    steps:
      # 升级至官方支持 Node.js 24 的最新组件
      - uses: actions/checkout@v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装运行依赖
        run: |
          pip install requests feedparser

      - name: 执行全网资讯监控
        run: python monitor.py

      - name: 自动保存运行状态到仓库
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add record.json || true
          git commit -m "自动更新运行状态 [skip ci]" || true
          git push || true
