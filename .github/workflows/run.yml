name: 全品类资讯飞书推送

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟自动巡查一次
  workflow_dispatch:      # 支持手动点击运行

# 全局开启 Node.js 24 环境变量，提前适配 GitHub 6月的强制策略
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 核心权限：允许将最新的record.json同步回你的仓库
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装运行依赖
        run: |
          pip install requests feedparser

      - name: 执行全网资讯监控
        run: python monitor.py

      - name: 自动保存运行状态到仓库
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add record.json || true
          git commit -m "自动更新运行状态 [skip ci]" || true
          git push || true
