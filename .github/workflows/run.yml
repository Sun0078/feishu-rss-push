name:全品类资讯飞书推送
on:
  schedule:
    cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置Python
        uses: actions/setup-python@v5
      - name: 安装依赖
        run: pip install requests
      - name: 执行全网资讯监控
        run: python monitor.py
