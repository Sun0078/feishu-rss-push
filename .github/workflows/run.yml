name: 全品类资讯飞书推送

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟自动巡查一次
  workflow_dispatch:      # 支持手动点击运行

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 关键权限：允许 Actions 修改并提交代码回你的仓库
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests feedparser

      - name: 执行全网资讯监控
        run: python monitor.py

      - name: 自动保存运行状态到仓库
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.name "actions@github.com"
          git add record.json || true
          git commit -m "自动更新运行状态 [skip ci]" || true
          git push || true
